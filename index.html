<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenAI API Client</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 94vh;
    }
    .config-panel {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
    }
    input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
    }
    input:focus { border-color: var(--accent); }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #334155;
      color: #e2e8f0;
      white-space: normal;
      overflow-wrap: anywhere;
      min-width: 0;
      overflow-x: auto;
    }
    .msg.assistant > :first-child { margin-top: 0; }
    .msg.assistant > :last-child { margin-bottom: 0; }
    .msg.assistant pre {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre;
    }
    .msg.assistant code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.9em;
      background: #0f172a;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .msg.assistant pre code { padding: 0; background: none; }
    .msg.assistant a { color: var(--accent); }
    .msg.assistant blockquote {
      margin-left: 0;
      padding-left: 12px;
      border-left: 3px solid var(--accent);
      color: var(--text-muted);
    }
    .msg.assistant table { border-collapse: collapse; }
    .msg.assistant th, .msg.assistant td {
      border: 1px solid var(--text-muted);
      padding: 6px 10px;
      text-align: left;
    }
    .msg.assistant.plain-text { white-space: pre-wrap; }
    .input-bar {
      display: flex;
      gap: 8px;
    }
    textarea {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      resize: none;
      height: 48px;
      font-family: inherit;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <!-- API Settings -->
  <div class="config-panel">
    <input type="text" id="endpoint" value="https://api.openai.com/v1/chat/completions" placeholder="API Endpoint URL" />
    <input type="text" id="model" value="gpt-4o-mini" placeholder="Model Name" />
    <input type="password" id="apiKey" placeholder="Bearer Token / API Key" />
  </div>

  <!-- Chat Log -->
  <div class="chat-box" id="chatBox"></div>

  <!-- Input Field -->
  <div class="input-bar">
    <textarea id="promptInput" placeholder="Type a message... (Press Enter to send, Shift+Enter for newline)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
<script>
  const messages = [];

  function renderAssistant(element, text) {
    if (!window.marked || !window.DOMPurify) {
      element.classList.add("plain-text");
      element.textContent = text;
      return;
    }
    element.classList.remove("plain-text");
    element.innerHTML = DOMPurify.sanitize(marked.parse(text), {
      USE_PROFILES: { html: true },
      FORBID_TAGS: ["style"],
      FORBID_ATTR: ["style"]
    });
  }

  function appendMessage(role, text) {
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    if (role === "assistant") renderAssistant(div, text);
    else div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const endpoint = document.getElementById("endpoint").value.trim();
    const model = document.getElementById("model").value.trim();
    const apiKey = document.getElementById("apiKey").value.trim();
    const text = promptInput.value.trim();

    if (!text || !endpoint) return;

    // Append user input
    messages.push({ role: "user", content: text });
    appendMessage("user", text);
    promptInput.value = "";
    sendBtn.disabled = true;

    // Create an empty assistant bubble for incoming chunks
    const assistantBubble = appendMessage("assistant", "...");
    let fullResponse = "";

    try {
      const headers = { "Content-Type": "application/json" };
      if (apiKey) {
        headers["Authorization"] = `Bearer ${apiKey}`;
      }

      const response = await fetch(endpoint, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
          model: model,
          messages: messages,
          stream: true
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${await response.text()}`);
      }

      assistantBubble.textContent = "";

      // Process SSE (Server-Sent Events) stream
      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop(); // Retain incomplete line

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith("data:")) continue;

          const data = trimmed.replace(/^data:\s*/, "");
          if (data === "[DONE]") break;

          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices?.[0]?.delta?.content || "";
            fullResponse += delta;
            renderAssistant(assistantBubble, fullResponse);
            document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
          } catch (e) {
            // Ignore parse errors from partial lines
          }
        }
      }

      messages.push({ role: "assistant", content: fullResponse });
    } catch (err) {
      assistantBubble.classList.add("plain-text");
      assistantBubble.textContent = `Error: ${err.message}`;
    } finally {
      sendBtn.disabled = false;
    }
  }

  // Handle enter key to send
  document.getElementById("promptInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
