<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenAI API Client</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 94vh;
    }
    .config-panel {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
    }
    input, select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
    }
    input:focus { border-color: var(--accent); }
    .chat-box {
      flex: 1;
      min-height: 0;
      overflow-anchor: none;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      flex-shrink: 0;
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #334155;
      color: #e2e8f0;
      white-space: normal;
      overflow-wrap: anywhere;
      min-width: 0;
    }
    .msg.assistant > :first-child { margin-top: 0; }
    .msg.assistant > :last-child { margin-bottom: 0; }
    .msg.assistant pre {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre;
    }
    .msg.assistant code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.9em;
      background: #0f172a;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .msg.assistant pre code { padding: 0; background: none; }
    .msg.assistant a { color: var(--accent); }
    .msg.assistant blockquote {
      margin-left: 0;
      padding-left: 12px;
      border-left: 3px solid var(--accent);
      color: var(--text-muted);
    }
    .msg.assistant .table-scroll { overflow-x: auto; }
    .msg.assistant table { border-collapse: collapse; }
    .msg.assistant th, .msg.assistant td {
      border: 1px solid var(--text-muted);
      padding: 6px 10px;
      text-align: left;
    }
    .msg.assistant.plain-text { white-space: pre-wrap; }
    .input-bar {
      display: flex;
      gap: 8px;
    }
    textarea {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      resize: none;
      height: 48px;
      font-family: inherit;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .thread-bar { display: flex; gap: 8px; }
    .thread-bar select { flex: 1; min-width: 0; }
    .thread-bar button { padding: 8px 12px; }
    .storage-note { margin: 0; color: var(--text-muted); font-size: 12px; }
    #storageStatus { color: #fbbf24; }
    @media (max-width: 600px) {
      .config-panel { grid-template-columns: 1fr; }
      .thread-bar { flex-wrap: wrap; }
      .msg { max-width: 95%; }
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <!-- API Settings -->
  <div class="config-panel">
    <input type="text" id="endpoint" value="https://api.openai.com/v1/chat/completions" placeholder="API Endpoint URL" />
    <input type="text" id="model" value="gpt-4o-mini" placeholder="Model Name" />
    <input type="password" id="apiKey" placeholder="Bearer Token / API Key" />
  </div>

  <p class="storage-note">Settings and chats are saved in this browser. The saved token is unencrypted.</p>
  <p class="storage-note" id="storageStatus" role="status" hidden></p>
  <div class="thread-bar">
    <select id="threadSelect" aria-label="Saved chats"></select>
    <button id="newThread" type="button">New chat</button>
    <button id="deleteThread" type="button">Delete chat</button>
    <button id="jumpLatest" type="button">Jump to latest</button>
  </div>

  <!-- Chat Log -->
  <div class="chat-box" id="chatBox"></div>

  <!-- Input Field -->
  <div class="input-bar">
    <textarea id="promptInput" placeholder="Type a message... (Press Enter to send, Shift+Enter for newline)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
<script>
  const STORAGE_KEY = "ai-chat-ui.v1";
  let threads = [];
  let activeThreadId;
  let messages = [];
  let sending = false;
  let saveTimer;

  function storageWarning(text) {
    const status = document.getElementById("storageStatus");
    status.textContent = text;
    status.hidden = false;
  }

  function currentThread() {
    return threads.find(thread => thread.id === activeThreadId);
  }

  function saveState() {
    clearTimeout(saveTimer);
    saveTimer = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        settings: Object.fromEntries(["endpoint", "model", "apiKey"].map(id => [id, document.getElementById(id).value])),
        threads,
        activeThreadId
      }));
      document.getElementById("storageStatus").hidden = true;
    } catch {
      storageWarning("Could not save in this browser (storage may be blocked or full). Keep this page open to retain this session.");
    }
  }

  function updateThreadList() {
    const select = document.getElementById("threadSelect");
    select.replaceChildren();
    for (const thread of threads) {
      const option = document.createElement("option");
      option.value = thread.id;
      option.textContent = thread.messages.find(message => message.role === "user")?.content.slice(0, 60) || "New chat";
      select.appendChild(option);
    }
    select.value = activeThreadId;
  }

  function showThread() {
    messages = currentThread().messages;
    const box = document.getElementById("chatBox");
    box.replaceChildren();
    for (const message of messages) appendMessage(message.role, message.content);
    box.scrollTop = 0;
    updateThreadList();
  }

  function newThread() {
    if (sending) return;
    const thread = { id: crypto.randomUUID(), messages: [] };
    threads.unshift(thread);
    activeThreadId = thread.id;
    showThread();
    saveState();
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const state = JSON.parse(raw);
        for (const id of ["endpoint", "model", "apiKey"]) {
          if (typeof state.settings?.[id] === "string") document.getElementById(id).value = state.settings[id];
        }
        if (!Array.isArray(state.threads)) throw new Error("Invalid threads");
        threads = state.threads.filter(thread => typeof thread.id === "string" && Array.isArray(thread.messages) &&
          thread.messages.every(message => ["user", "assistant"].includes(message.role) && typeof message.content === "string"));
        activeThreadId = threads.find(thread => thread.id === state.activeThreadId)?.id || threads[0]?.id;
      }
    } catch {
      storageWarning("Saved chats could not be loaded. This session can still be used.");
    }
    if (threads.length) showThread();
    else newThread();
  }

  function renderAssistant(element, text) {
    if (!window.marked || !window.DOMPurify) {
      element.classList.add("plain-text");
      element.textContent = text;
      return;
    }
    element.classList.remove("plain-text");
    element.innerHTML = DOMPurify.sanitize(marked.parse(text), {
      USE_PROFILES: { html: true },
      FORBID_TAGS: ["style"],
      FORBID_ATTR: ["style"]
    });
    element.querySelectorAll("table").forEach((table) => {
      const wrapper = document.createElement("div");
      wrapper.className = "table-scroll";
      table.replaceWith(wrapper);
      wrapper.appendChild(table);
    });
  }

  function appendMessage(role, text) {
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    if (role === "assistant") renderAssistant(div, text);
    else div.textContent = text;
    box.appendChild(div);
    return div;
  }

  async function sendMessage() {
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const endpoint = document.getElementById("endpoint").value.trim();
    const model = document.getElementById("model").value.trim();
    const apiKey = document.getElementById("apiKey").value.trim();
    const text = promptInput.value.trim();

    if (sending || !text || !endpoint) return;
    sending = true;

    // Append user input
    messages.push({ role: "user", content: text });
    appendMessage("user", text);
    promptInput.value = "";
    sendBtn.disabled = true;
    for (const id of ["threadSelect", "newThread", "deleteThread"]) document.getElementById(id).disabled = true;
    updateThreadList();
    saveState();

    // Create an empty assistant bubble for incoming chunks
    const assistantBubble = appendMessage("assistant", "...");
    const box = document.getElementById("chatBox");
    box.scrollTop = box.scrollHeight;
    let fullResponse = "";
    // Store partial replies as well, so a reload can recover the streamed text.
    const reply = { role: "assistant", content: "" };
    const requestMessages = messages.map(message => ({ ...message }));
    messages.push(reply);

    try {
      const headers = { "Content-Type": "application/json" };
      if (apiKey) {
        headers["Authorization"] = `Bearer ${apiKey}`;
      }

      const response = await fetch(endpoint, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
          model: model,
          messages: requestMessages,
          stream: true
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${await response.text()}`);
      }

      assistantBubble.textContent = "";

      // Process SSE (Server-Sent Events) stream
      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop(); // Retain incomplete line

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith("data:")) continue;

          const data = trimmed.replace(/^data:\s*/, "");
          if (data === "[DONE]") break;

          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices?.[0]?.delta?.content || "";
            fullResponse += delta;
            reply.content = fullResponse;
            const readingPosition = box.scrollTop;
            renderAssistant(assistantBubble, fullResponse);
            box.scrollTop = readingPosition;
            if (!saveTimer) saveTimer = setTimeout(() => { saveTimer = null; saveState(); }, 500);
          } catch (e) {
            // Ignore parse errors from partial lines
          }
        }
      }
    } catch (err) {
      assistantBubble.classList.add("plain-text");
      assistantBubble.textContent = `${fullResponse ? fullResponse + "\n\n" : ""}Error: ${err.message}`;
    } finally {
      sending = false;
      sendBtn.disabled = false;
      for (const id of ["threadSelect", "newThread", "deleteThread"]) document.getElementById(id).disabled = false;
      if (!reply.content) messages.splice(messages.indexOf(reply), 1);
      clearTimeout(saveTimer);
      saveTimer = null;
      saveState();
    }
  }

  for (const id of ["endpoint", "model", "apiKey"]) document.getElementById(id).addEventListener("input", saveState);
  document.getElementById("newThread").addEventListener("click", newThread);
  document.getElementById("threadSelect").addEventListener("change", (event) => {
    if (sending) return;
    activeThreadId = event.target.value;
    showThread();
    saveState();
  });
  document.getElementById("deleteThread").addEventListener("click", () => {
    if (sending) return;
    threads = threads.filter(thread => thread.id !== activeThreadId);
    if (!threads.length) return newThread();
    activeThreadId = threads[0].id;
    showThread();
    saveState();
  });
  document.getElementById("jumpLatest").addEventListener("click", () => {
    const box = document.getElementById("chatBox");
    box.scrollTop = box.scrollHeight;
  });
  window.addEventListener("pagehide", saveState);
  loadState();

  // Handle enter key to send
  document.getElementById("promptInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
